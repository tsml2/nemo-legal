name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Só o gate de segredo: este repo não tem dependência para escanear.
  # Vale mesmo assim: chave commitada uma vez fica no histórico para sempre.
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Actions de terceiros pinadas por SHA, não por tag mutável — tag pode ser
      # movida pelo autor upstream ou por quem sequestrar a conta dele.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Varre o HISTÓRICO, não só o diff: chave commitada e removida depois
          # continua recuperável por quem clonar.
          fetch-depth: 0

      - name: Gate — nenhum segredo no histórico
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/gitleaks.tar.gz" -C "$tmp" gitleaks
          "$tmp/gitleaks" git --redact -v --exit-code=1 --config .gitleaks.toml .
